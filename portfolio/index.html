<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <title>Portfolio</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-box">
                <div class="header-logo">
                    <img src="./assets/icons/icon.svg" alt="logo">
                </div>
                <div class="header-nav">
                    <a href="#">ABOUT ME</a>
                    <a href="#">PORTFOLIO</a>
                    <a href="#">PRICE</a>
                    <a href="#">FAQ</a>
                    <a href="#">CONTACTS</a>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <div class="hero-box">
                    <div class="hero-achievement">
                        <p>Best - by MAX</p>
                        <img src="./assets/icons/line.png" alt="line">
                        <p>2025</p>
                    </div>
                    <div class="hero-description">
                        <div class="hero-description--box">
                            <div class="hero-description--main">
                                <div class="hero-description--count">
                                    <div class="count">
                                        <p class="count-title">+</p>
                                        <div class="count-box">
                                            <p class="count-title">487</p>
                                            <p class="count-text">Photo sessions</p>
                                        </div>
                                    </div>
                                    <div class="count">
                                        <p class="count-title">+</p>
                                        <div class="count-box">
                                            <p class="count-title">356</p>
                                            <p class="count-text">Satisfied clients</p>
                                        </div>
                                    </div>
                                </div>
                                <h1 class="hero-title">PROFESSIONAL PHOTOGRAPHER</h1>
                                <p class="hero-title--text">CAPTURE THE MOMENT. TELL YOUR STORY.</p>
                            </div>
                            <a class="scrolldown">
                                <p>Scroll down</p>
                                <img src="./assets/icons/arrow-down.svg" alt="arrow-down">
                            </a>
                        </div>
                        <div class="hero-description-image">
                            <img src="./assets/images/img-10.webp" alt="">
                        </div>
                        <div class="hero-description-foto">
                            <img src="./assets/images/img-11.webp" alt="">
                            <p>Hi! I’m Vera, a photographer. For me, photography is more than just an image. </p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
